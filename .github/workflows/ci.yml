
name: ClubOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clubos_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: clubos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clubos_user -d clubos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: clubos
        DB_USER: clubos_user
        DB_PASSWORD: ci_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Diagnose database connection
        run: |
          python - <<'PY'
          import psycopg
          from app.config.settings import settings

          print("Host:", settings.DB_HOST)
          print("Port:", settings.DB_PORT)
          print("Database:", settings.DB_NAME)
          print("User:", settings.DB_USER)
          print(
              "Password matches CI password:",
              settings.DB_PASSWORD == "ci_test_password"
          )

          try:
              conn = psycopg.connect(
                  host=settings.DB_HOST,
                  port=settings.DB_PORT,
                  dbname=settings.DB_NAME,
                  user=settings.DB_USER,
                  password=settings.DB_PASSWORD,
              )
              print("PostgreSQL connection: SUCCESS")
              conn.close()
          except Exception as error:
              print("PostgreSQL connection: FAILED")
              print(type(error).__name__, str(error))
              raise
          PY


      - name: Apply database migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: clubos
          DB_USER: clubos_user
          DB_PASSWORD: ci_test_password
        run: alembic upgrade head

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: clubos
          DB_USER: clubos_user
          DB_PASSWORD: ci_test_password
        run: pytest

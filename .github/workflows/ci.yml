
name: ClubOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clubos_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: clubos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clubos_user -d clubos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: clubos
        DB_USER: clubos_user
        DB_PASSWORD: ci_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install PostgreSQL 17 backup tools
        run: |
          if [[ ! -x /usr/lib/postgresql/17/bin/pg_dump ]]; then
            if ! apt-cache show postgresql-client-17 >/dev/null 2>&1 && ! grep -rqs 'apt.postgresql.org' /etc/apt/sources.list.d; then
              . /etc/os-release
              sudo install -d /usr/share/postgresql-common/pgdg
              sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
                -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
              printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" \
                | sudo tee /etc/apt/sources.list.d/clubos-pgdg.list >/dev/null
            fi
            sudo apt-get update -q
            sudo apt-get install -q -y --no-install-recommends postgresql-client-17
          fi
          printf '%s\n' /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Apply database migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: clubos
          DB_USER: clubos_user
          DB_PASSWORD: ci_test_password
        run: alembic upgrade head
      
      - name: Create test database
        run: |
          python - <<'PY'
          import psycopg
          from app.config.settings import settings

          with psycopg.connect(
              host=settings.DB_HOST,
              port=settings.DB_PORT,
              dbname=settings.DB_NAME,
              user=settings.DB_USER,
              password=settings.DB_PASSWORD,
              autocommit=True,
          ) as conn:
              conn.execute("CREATE DATABASE clubos_test")
          PY

      - name: Apply test database migrations
        env:
          DB_NAME: clubos_test
        run: alembic upgrade head

      - name: Run automated tests
        env:
          DB_NAME: clubos_test
          APP_ENV: test
          ATTACHMENT_STORAGE_DIRECTORY: ${{ runner.temp }}/clubos-private-fixtures
        run: python -m pytest -v

      - name: Check schema consistency
        env:
          DB_NAME: clubos_test
        run: alembic check




name: ClubOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clubos_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: clubos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clubos_user -d clubos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: clubos
        DB_USER: clubos_user
        DB_PASSWORD: ci_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest


name: ClubOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clubos_user
          POSTGRES_PASSWORD: clubos_ci_password
          POSTGRES_DB: clubos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clubos_user -d clubos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: clubos
      DB_USER: clubos_user
      DB_PASSWORD: sasya1225

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app migrations

      - name: Test database migrations
        run: |
          alembic upgrade head
